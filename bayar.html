<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Konfirmasi Pembayaran</title>
    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            background-color: #ffffff;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        img {
            max-width: 90%;
            max-height: 65vh;
            object-fit: contain;
            border-radius: 16px;
        }
        .status {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #007aff;
            transition: color 0.3s;
        }
    </style>
</head>
<body>
    <img src="RISPEK SUDAH MEMBAYAR😎😎👍.jpg" alt="Rispek Sudah Membayar">
    <div id="status-text" class="status">Memproses Pembayaran...</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCzF4O5tW-VvA1lIeDS7XOaqCd6Tu6X99c",
    authDomain: "kantin-biru.firebaseapp.com",
    databaseURL: "https://kantin-biru-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "kantin-biru",
    storageBucket: "kantin-biru.firebasestorage.app",
    messagingSenderId: "320644740041",
    appId: "1:320644740041:web:31fc44121d3be181a1ae18"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const urlParams = new URLSearchParams(window.location.search);
  const orderId = urlParams.get('orderId');
  const statusEl = document.getElementById('status-text');

  async function konfirmasiPembayaran() {
    if (!orderId) {
      if (statusEl) {
        statusEl.textContent = "ID Pesanan tidak ditemukan.";
        statusEl.style.color = "#ef4444";
      }
      return;
    }

    try {
      await update(ref(db, "orders/" + orderId), { 
        status: 'sedang_dimasak' 
      });
      if (statusEl) {
        statusEl.textContent = "Pembayaran Berhasil! Pesanan Anda sedang dimasak.";
        statusEl.style.color = "#10b981";
      }
    } catch (error) {
      console.error("Gagal update status:", error);
      if (statusEl) {
        statusEl.textContent = "Gagal memproses pembayaran. Periksa koneksi internet.";
        statusEl.style.color = "#ef4444";
      }
    }
  }

  konfirmasiPembayaran();
</script>
</body>
</html>
